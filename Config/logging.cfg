# =============================================================================
#  Infinity Football — logging.cfg
#  Logging configuration read at startup. Level values (least to most severe):
#  trace, debug, info, warning, error. Messages below the level are dropped.
# =============================================================================

[logging]
level = info
# Sinks are wired in code (console + Logs/infinity.log); these flags document
# intent and are honoured as sink toggles by later missions.
console = true
file = true
