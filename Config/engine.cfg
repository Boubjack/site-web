# =============================================================================
#  Infinity Football — engine.cfg
#  Core engine settings. INI-style: [section] then key = value. Lines starting
#  with '#' or ';' are comments. Parsed by the Config subsystem at startup.
# =============================================================================

[application]
name = Infinity Football
# Target frame rate for the fixed-timestep simulation (Hz).
target_fps = 60

[video]
# Window size (used by a future windowed build; harmless in headless mode).
width = 1280
height = 720
fullscreen = false
vsync = true
# Vertical field of view in degrees for the broadcast camera.
fov = 60

[audio]
# Master and per-channel gains in [0, 1].
master = 0.9
crowd = 0.8
commentary = 1.0
effects = 1.0
music = 0.6

[performance]
# Tuned for a mid-range PC; kept conservative for the foundation.
resource_cache_mb = 512
worker_threads = 4
