# =============================================================================
#  Infinity Football — input.cfg
#  Default action bindings. The [keyboard] section maps an action to a key name;
#  the [gamepad] section maps the same actions to controller buttons. Both are
#  loaded so keyboard and gamepad work simultaneously (see InputSystem).
#  Key/button names must match Engine/Input/InputCodes.hpp.
# =============================================================================

[keyboard]
MenuUp = Up
MenuDown = Down
MenuLeft = Left
MenuRight = Right
Confirm = Enter
Cancel = Escape
Pause = Space

[gamepad]
MenuUp = Up
MenuDown = Down
MenuLeft = Left
MenuRight = Right
Confirm = A
Cancel = B
Pause = Start
